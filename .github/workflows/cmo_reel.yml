name: CMO 릴스 즉시 게시 (이노AI 관제 서버 — 대표 승인분만 반입됨)
# 이노AI CMO가 만든 영상은 대표가 관제 화면/Slack에서 '승인'한 뒤에만 cmo-reels/<작업번호>/ 로 반입된다.
# 반입(push)되면 기존 publish_reel.js와 같은 IG 비밀 설정으로 바로 릴스를 게시하고 결과를 published.json에 남긴다.
# 실패하면 failed.json을 남긴다. 관제 서버는 이 두 파일을 읽어 대표에게 보고한다.
on:
  push:
    branches: [main]
    paths: ['cmo-reels/*/request.json']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cmo-reel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 반입된 요청 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          shopt -s nullglob
          for req in cmo-reels/*/request.json; do
            dir=$(dirname "$req")
            # 이미 처리한 요청은 건너뛴다 (중복 게시 차단)
            if [ -f "$dir/published.json" ] || [ -f "$dir/failed.json" ]; then continue; fi
            base=$(node -e "const r=require('./$req'); if(!/^https:\/\//.test(r.base_url||'')) process.exit(1); process.stdout.write(r.base_url)") || { echo '{"error":"base_url 없음"}' > "$dir/failed.json"; continue; }
            if IMG_BASE_URL="$base" node publish_reel.js "$dir"; then
              echo "게시 완료: $dir"
            else
              node -e "require('fs').writeFileSync('$dir/failed.json', JSON.stringify({error:'publish_reel.js 실패 — Actions 로그 확인', at:new Date().toISOString()}))"
            fi
          done
      - name: 결과 기록
        if: always()
        run: |
          git config user.name "cmo-reel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cmo-reels/*/published.json cmo-reels/*/failed.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "chore: CMO 릴스 게시 결과 기록"; git pull --rebase origin main; git push; }
